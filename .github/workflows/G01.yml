name: G01 Dominoes
on:
  pull_request:
    paths:
      - 'jobs/G01-dominoes/**'
      - 'contract/**'
      - '.github/workflows/G01.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: jobs/G01-dominoes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: jobs/G01-dominoes/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm install --prefix ../../contract --ignore-scripts --no-package-lock --no-audit --no-fund
      - run: npm test
