name: G06 Spades
on:
  pull_request:
    paths:
      - 'jobs/G06-spades/**'
      - 'contract/**'
      - '.github/workflows/G06.yml'
permissions:
  contents: read
concurrency:
  group: G06-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: jobs/G06-spades
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: jobs/G06-spades/package-lock.json
      - name: Install pinned dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --prefix ../../contract --ignore-scripts --no-audit --no-fund --no-package-lock zod@4.6.5
          npx playwright install --with-deps chromium
      - name: All core, data, mutation, bot and browser checks
        run: npm test
      - name: Preserve actual browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: G06-browser-evidence-${{ github.run_id }}
          path: |
            jobs/G06-spades/browser-report.json
            jobs/G06-spades/browser-raw-1-*.json
            jobs/G06-spades/capture-milestone-11-report.json
            jobs/G06-spades/media/milestone-11-pinned-encoder.webm
          if-no-files-found: warn
