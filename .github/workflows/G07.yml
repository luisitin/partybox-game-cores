name: G07 Liar's Dice
on:
  pull_request:
    paths:
      - 'jobs/G07-liars-dice/**'
      - '.github/workflows/G07.yml'
      - 'contract/**'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: jobs/G07-liars-dice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: jobs/G07-liars-dice/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: G07-browser-evidence
          path: jobs/G07-liars-dice/.work/browser/
          if-no-files-found: warn
          retention-days: 14
