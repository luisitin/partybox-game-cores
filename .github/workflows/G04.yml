name: G04 Reality Check
on:
  pull_request:
    paths:
      - 'jobs/G04-reality-check/**'
      - 'contract/**'
      - '.github/workflows/G04.yml'
permissions:
  contents: read
concurrency:
  group: G04-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: jobs/G04-reality-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: jobs/G04-reality-check/package-lock.json
      - name: Install pinned dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --prefix ../../contract --ignore-scripts --no-audit --no-fund --no-package-lock zod@4.6.5
          npx playwright install --with-deps chromium
      - name: Pinned screen capture encoder
        run: npx playwright install ffmpeg
      - name: All core, data, bot and browser checks
        run: npm test
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: G04-browser-evidence-${{ github.sha }}
          if-no-files-found: warn
          path: |
            jobs/G04-reality-check/browser-report.json
            jobs/G04-reality-check/browser-repeat-*.json
            jobs/G04-reality-check/browser-raw-*.json
            jobs/G04-reality-check/late-input-report.json
            jobs/G04-reality-check/media/milestone-15-browser*.webm
