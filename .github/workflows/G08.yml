name: G08 Shake Up
on:
  pull_request:
    paths:
      - 'jobs/G08-word-grid/**'
      - '.github/workflows/G08.yml'
      - 'contract/**'
  push:
    branches: ['job/G08-*']
    paths:
      - 'jobs/G08-word-grid/**'
      - '.github/workflows/G08.yml'
permissions:
  contents: read
concurrency:
  group: G08-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: jobs/G08-word-grid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: jobs/G08-word-grid/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Install locked Playwright disk browser
        run: npx playwright-core install chromium --only-shell --with-deps
      - name: Install capture tool
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo timeout --signal=TERM --kill-after=15s 60s apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
            sudo timeout --signal=TERM --kill-after=15s 180s apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: G08-check-evidence
          include-hidden-files: true
          if-no-files-found: error
          path: |
            jobs/G08-word-grid/.tmp/visual/
            jobs/G08-word-grid/.tmp/check-*.log
            jobs/G08-word-grid/.tmp/mutations/*.json
