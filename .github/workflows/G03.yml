name: G03 Pack the Hold
on:
  pull_request:
    paths:
      - 'jobs/G03-pack-the-hold/**'
      - '.github/workflows/G03.yml'
      - 'contract/**'
permissions:
  contents: read
concurrency:
  group: G03-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: jobs/G03-pack-the-hold
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: jobs/G03-pack-the-hold/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Install screen capture dependency
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - run: npm test
      - run: node scripts/benchmark.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: G03-check-evidence
          include-hidden-files: true
          if-no-files-found: error
          path: |
            jobs/G03-pack-the-hold/.tmp/visual/
            jobs/G03-pack-the-hold/.tmp/solve-times.json
            jobs/G03-pack-the-hold/.tmp/mutation-results.json
            jobs/G03-pack-the-hold/.tmp/total-*.json
