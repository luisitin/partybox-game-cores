name: G02 Gin Rummy
on:
  pull_request:
    paths:
      - 'jobs/G02-gin-rummy/**'
      - '.github/workflows/G02.yml'
      - 'contract/**'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: jobs/G02-gin-rummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: jobs/G02-gin-rummy/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: G02-browser-evidence
          path: |
            jobs/G02-gin-rummy/.work/browser/*-frames.json
            jobs/G02-gin-rummy/.work/browser/report.json
            jobs/G02-gin-rummy/.work/browser/captures.json
            jobs/G02-gin-rummy/.work/browser/ci-current-*.webm
            jobs/G02-gin-rummy/.work/clock-after.json
            jobs/G02-gin-rummy/.work/custom-meld-after.json
            jobs/G02-gin-rummy/.work/results-after.json
            jobs/G02-gin-rummy/.work/name-check.json
            jobs/G02-gin-rummy/media/strict-reverify-1900-*.webm
            jobs/G02-gin-rummy/evidence/resume-20261008/strict-reverify-1900-captures.json
          include-hidden-files: true
          if-no-files-found: warn
  browser-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: jobs/G02-gin-rummy
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha }}
    - uses: actions/setup-node@v4
      with:
        node-version: 22.16.0
        cache: npm
        cache-dependency-path: jobs/G02-gin-rummy/package-lock.json
    - name: Read the explicit once-only bootstrap request
      id: request
      run: |-
        node --input-type=module <<'JS'
        import assert from 'node:assert/strict';
        import {readFile,appendFile} from 'node:fs/promises';
        import {createHash} from 'node:crypto';
        const request=JSON.parse(await readFile('evidence/audit-20261009/bootstrap-request.json','utf8'));
        assert.equal(request.version,1);assert.equal(typeof request.enabled,'boolean');
        if(request.enabled){
         assert(['mandatory one-workflow correction; first capture binding the corrected G02 workflow','verified material Strong Gin-priority repair; first capture for changed game source','verified material Gin draw repair; first capture for changed game source','verified material same-meld finishing knock repair; first capture for changed game source','verified material closed-meld finishing knock repair; first capture for changed game source','verified material public-discard closed-meld finishing knock repair; first capture for changed game source'].includes(request.reason),'explicit material/protocol bootstrap reason required');
         const sha=bytes=>createHash('sha256').update(bytes).digest('hex');
         assert.equal(sha(await readFile('src/core.ts')),request.coreSha256);
         assert.equal(sha(await readFile('play.html')),request.htmlSha256);
        }
        await appendFile(process.env.GITHUB_OUTPUT,'bootstrap='+String(request.enabled)+'\n');
        console.log(JSON.stringify({nativeBootstrapRequested:request.enabled,samplersExecuted:false,reason:request.reason}));
        JS
    - name: Record the exact one-shot run identity
      run: |
        mkdir -p .work/initial-presence-bootstrap
        node --input-type=module <<'JS'
        import {writeFile} from 'node:fs/promises';
        import assert from 'node:assert/strict';
        import {execFileSync} from 'node:child_process';
        const identity={version:1,head:process.env.G02_SOURCE_HEAD,ref:process.env.GITHUB_REF,sourceBranch:process.env.GITHUB_HEAD_REF,checkoutSha:execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),runId:process.env.GITHUB_RUN_ID,runAttempt:process.env.GITHUB_RUN_ATTEMPT,job:process.env.GITHUB_JOB,repository:process.env.GITHUB_REPOSITORY,startedUtc:new Date().toISOString(),purpose:'Fresh original browser evidence for an explicitly requested material G02 repair; not full npm-test acceptance.',originalVerifyJobUnchanged:true,physicalPhoneTested:false};
        await writeFile('.work/initial-presence-bootstrap/run.json',JSON.stringify(identity,null,2)+'\n');
        assert.equal(identity.runAttempt,'1','this bootstrap must not be rerun to chase a frame pass');
        assert.equal(identity.sourceBranch,'job/G02-gin-rummy-audit-20261009');
        assert.equal(identity.checkoutSha,identity.head,'bootstrap checkout must be the exact source head');
        JS
      if: steps.request.outputs.bootstrap == 'true'
    - run: npm ci --ignore-scripts --no-audit --no-fund
      if: steps.request.outputs.bootstrap == 'true'
    - run: npx playwright install --with-deps chromium
      if: steps.request.outputs.bootstrap == 'true'
    - run: npm run build
      if: steps.request.outputs.bootstrap == 'true'
    - name: Require the committed standalone page to match the original build
      run: git diff --exit-code -- play.html
      if: steps.request.outputs.bootstrap == 'true'
    - name: Preserve every original guarded input before native execution
      run: |
        node --input-type=module <<'JS'
        import assert from 'node:assert/strict';
        import {readFile,writeFile,mkdir} from 'node:fs/promises';
        import {dirname} from 'node:path';
        import {browserSourcePaths,browserSourceHashes,sha256} from './scripts/browser-source-guard.mjs';
        const base='.work/initial-presence-bootstrap',sources=await browserSourceHashes(),copied=[];
        const destination=path=>{
          if(path.startsWith('../../contract/'))return base+'/sources/contract/'+path.slice('../../contract/'.length);
          if(path==='../../.github/workflows/G02.yml')return base+'/sources/workflow/G02.yml';
          assert(!path.startsWith('../')&&!path.startsWith('/'));return base+'/sources/job/'+path;
        };
        for(const path of browserSourcePaths){
          const bytes=await readFile(path),target=destination(path);assert.equal(sha256(bytes),sources[path]);
          await mkdir(dirname(target),{recursive:true});await writeFile(target,bytes);
          copied.push({originalPath:path,artifactPath:target,bytes:bytes.length,sha256:sha256(bytes)});
        }
        const additionalSources={},additionalCopied=[];
        for(const [originalPath,artifactPath] of [['../../contract/package.json',base+'/sources/contract/package.json'],['evidence/audit-20261009/bootstrap-request.json',base+'/bootstrap-request.json']]){
         const bytes=await readFile(originalPath);additionalSources[originalPath]=sha256(bytes);await writeFile(artifactPath,bytes);additionalCopied.push({originalPath,artifactPath,bytes:bytes.length,sha256:sha256(bytes)});
        }
        const bootstrap=await readFile('../../.github/workflows/G02.yml');
        await writeFile(base+'/bootstrap-workflow.yml',bootstrap);
        await writeFile(base+'/source-start.json',JSON.stringify(sources,null,2)+'\n');
        await writeFile(base+'/source-copy-index.json',JSON.stringify({version:1,head:process.env.G02_SOURCE_HEAD,originalGuardedSources:browserSourcePaths.length,bootstrapWorkflowSha256:sha256(bootstrap),additionalSources,additionalCopied,copied},null,2)+'\n');
        assert.equal(copied.length,35);
        console.log(JSON.stringify({preservedOriginalInputs:copied.length,head:process.env.G02_SOURCE_HEAD}));
        JS
      if: steps.request.outputs.bootstrap == 'true'
    - name: Run the unchanged original 600-interval desktop and phone checks once
      run: node scripts/browser-check.mjs
      if: steps.request.outputs.bootstrap == 'true'
    - name: Record the unchanged separate functional clips
      run: node scripts/capture.mjs initial-presence-bootstrap --public-history --ci-output
      if: steps.request.outputs.bootstrap == 'true'
    - name: Validate all 35 current sources and every fresh native sample and clip
      run: node scripts/strict-browser-proof.mjs --live
      if: steps.request.outputs.bootstrap == 'true'
    - name: Preserve complete actual outputs and closing guards on success or failure
      if: always() && steps.request.outputs.bootstrap == 'true'
      env:
        BOOTSTRAP_STATUS: ${{ job.status }}
      run: |
        node --input-type=module <<'JS'
        import assert from 'node:assert/strict';
        import {readFile,writeFile,mkdir,readdir} from 'node:fs/promises';
        import {browserSourceHashes,sha256} from './scripts/browser-source-guard.mjs';
        const base='.work/initial-presence-bootstrap';await mkdir(base,{recursive:true});
        let sources=null,sourceError=null;try{sources=await browserSourceHashes();}catch(error){sourceError=String(error);}
        let bootstrapWorkflowSha256=null,bootstrapWorkflowError=null;try{bootstrapWorkflowSha256=sha256(await readFile('../../.github/workflows/G02.yml'));}catch(error){bootstrapWorkflowError=String(error);}
        let additionalSources=null,additionalSourceError=null;try{additionalSources={};for(const path of ['../../contract/package.json','evidence/audit-20261009/bootstrap-request.json'])additionalSources[path]=sha256(await readFile(path));}catch(error){additionalSourceError=String(error);}
        await writeFile(base+'/source-end.json',JSON.stringify({sources,sourceError,bootstrapWorkflowSha256,bootstrapWorkflowError,additionalSources,additionalSourceError},null,2)+'\n');
        let before=null,beforeIndex=null;try{before=JSON.parse(await readFile(base+'/source-start.json','utf8'));beforeIndex=JSON.parse(await readFile(base+'/source-copy-index.json','utf8'));}catch{}
        const files=[];
        async function walk(path){let entries;try{entries=await readdir(path,{withFileTypes:true});}catch{return;}
          for(const entry of entries.sort((a,b)=>a.name.localeCompare(b.name))){const next=path+'/'+entry.name;
            if(entry.isDirectory())await walk(next);else if(entry.isFile()){const bytes=await readFile(next);files.push({path:next,bytes:bytes.length,sha256:sha256(bytes)});}
          }
        }
        await walk('.work/browser');await walk(base);
        for(const path of ['.work/clock-after.json','.work/custom-meld-after.json','.work/results-after.json','.work/name-check.json']){
          try{const bytes=await readFile(path);files.push({path,bytes:bytes.length,sha256:sha256(bytes)});}catch{}
        }
        const sourceUnchanged=before!==null&&sources!==null&&JSON.stringify(before)===JSON.stringify(sources);
        const bootstrapWorkflowUnchanged=beforeIndex!==null&&bootstrapWorkflowSha256===beforeIndex.bootstrapWorkflowSha256;
        const additionalSourceUnchanged=beforeIndex!==null&&additionalSources!==null&&JSON.stringify(additionalSources)===JSON.stringify(beforeIndex.additionalSources);
        const closed={version:1,head:process.env.G02_SOURCE_HEAD,runId:process.env.GITHUB_RUN_ID,runAttempt:process.env.GITHUB_RUN_ATTEMPT,closedUtc:new Date().toISOString(),statusBeforeClosure:process.env.BOOTSTRAP_STATUS,sourceUnchanged,sourceError,bootstrapWorkflowUnchanged,bootstrapWorkflowSha256,bootstrapWorkflowError,additionalSourceUnchanged,additionalSources,additionalSourceError,files,rawFiltering:'none',fullNpmTestAccepted:false};
        await writeFile(base+'/CLOSED.json',JSON.stringify(closed,null,2)+'\n');
        console.log(JSON.stringify({closedUtc:closed.closedUtc,head:closed.head,files:files.length,sourceUnchanged,statusBeforeClosure:closed.statusBeforeClosure}));
        if(before!==null){assert(sourceUnchanged,'guarded inputs changed during the bootstrap');assert(bootstrapWorkflowUnchanged,'the bootstrap workflow changed during execution');assert(additionalSourceUnchanged,'the contract package or explicit request changed during execution');}
        JS
    - uses: actions/upload-artifact@v4
      if: always() && steps.request.outputs.bootstrap == 'true'
      with:
        name: G02-initial-presence-current-${{ github.event.pull_request.head.sha }}
        path: |
          jobs/G02-gin-rummy/.work/initial-presence-bootstrap/**
          jobs/G02-gin-rummy/.work/browser/**
          jobs/G02-gin-rummy/.work/clock-after.json
          jobs/G02-gin-rummy/.work/custom-meld-after.json
          jobs/G02-gin-rummy/.work/results-after.json
          jobs/G02-gin-rummy/.work/name-check.json
        include-hidden-files: true
        if-no-files-found: error
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'job/G02-gin-rummy-audit-20261009'
    concurrency:
      group: G02-initial-presence-browser-bootstrap
      cancel-in-progress: false
    env:
      G02_SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
